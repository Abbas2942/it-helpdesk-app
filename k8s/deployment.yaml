
apiVersion: apps/v1
kind: Deployment
metadata:
  name: it-helpdesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: it-helpdesk
  template:
    metadata:
      labels:
        app: it-helpdesk
    spec:
      containers:
        - name: it-helpdesk
          image: it-helpdesk:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: ticket-data
              mountPath: /data
      volumes:
        - name: ticket-data
          emptyDir: {}

